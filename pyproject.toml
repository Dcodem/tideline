[project]
name = "tideline"
version = "0.3.0"
description = "A small CLI for keeping a daily log."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniel Code McNeil", email = "dancodemcneil@gmail.com" }]
dependencies = ["click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
tideline = "tideline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
